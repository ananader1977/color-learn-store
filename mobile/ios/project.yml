name: ColorLearn
options:
  bundleIdPrefix: net.anasnader
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    SWIFT_VERSION: '5.0'
targets:
  ColorLearn:
    type: application
    platform: iOS
    sources: [ColorLearn]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.anasnader.colorlearn
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 'Color & Learn'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsDocumentBrowser: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ColorLearn/Info.plist
      properties:
        CFBundleURLTypes: []
        UILaunchScreen: {}
